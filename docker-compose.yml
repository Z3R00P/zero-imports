services:
  db:
    image: mysql:8.0
    container_name: mysql_zeroimports
    restart: always
    environment:
      MYSQL_DATABASE: zeroimports_db
      MYSQL_ROOT_PASSWORD:
      MYSQL_USER: zeroimports_user
      MYSQL_PASSWORD:
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
